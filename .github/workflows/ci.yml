# Continuous integration: runs on GitHub's servers after every push / pull request.
# It only READS the repo and reports pass/fail -- it never changes code, data or models.
#
#   tests     the full pytest suite + the frozen-v1 manifest check, on Windows with the
#             exact Python and package versions used locally (requirements.lock.txt), so
#             the bit-for-bit reproduction tests run on the same platform they were frozen on.
#   security  gitleaks (no secrets anywhere in git history) and pip-audit (no known
#             vulnerabilities in the pinned packages). Also runs weekly, because new
#             advisories appear without any code change.
#
# Supply chain: actions are pinned by commit SHA (tag in the comment); the gitleaks binary
# is pinned by version AND verified by its published SHA-256 before use.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13.2"
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Install pinned environment
        run: python -m pip install -r requirements.lock.txt

      # The retrieval index and analogue table are gitignored (regenerable). Rebuild them
      # with the project's own scripts; verified to give the same index as the local one.
      - name: Rebuild retrieval index and analogues
        run: |
          python -m retrieval.build_index
          python -m retrieval.precompute_analogues

      - name: Tests
        run: python -m pytest -q

      - name: Frozen v1 manifest check
        run: python scripts/make_manifest.py --check

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # full history, so gitleaks scans every commit
          persist-credentials: false

      - name: Secret scan (gitleaks, full history)
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "${tarball}" gitleaks
          ./gitleaks git . --redact --no-banner

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      # --no-deps --disable-pip: audit exactly the pinned versions listed, without
      # downloading or installing them (the lock file is a full freeze, so it is complete).
      - name: Dependency audit (pip-audit)
        run: |
          set -euo pipefail
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements.txt -r requirements.lock.txt \
            --no-deps --disable-pip --strict --progress-spinner off
