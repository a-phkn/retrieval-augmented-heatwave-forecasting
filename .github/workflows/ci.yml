# Continuous integration: runs on GitHub's servers after every push / pull request.
# It only READS the repo and reports pass/fail -- it never changes code, data or models.
#
#   tests     the full pytest suite, the frozen-v1 and test-run manifest checks, and the test
#             lock (the code under the locked folders is still exactly the code tagged
#             test-lock), on Windows with the exact Python and core package versions used
#             locally (requirements.lock.txt; the post-test foundation-model packages are not
#             needed here). GitHub runners vary in CPU type, and float arithmetic can differ in
#             the last digits between CPU types. So the bit-for-bit A1 retraining test runs
#             locally only, and the rebuilt index statistics are compared with a tolerance.
#   security  gitleaks (no secrets anywhere in git history) and pip-audit (no known
#             vulnerabilities in the pinned packages). Also runs weekly, because new
#             advisories appear without any code change.
#
# Supply chain: actions are pinned by commit SHA (tag in the comment); the gitleaks binary
# is pinned by version AND verified by its published SHA-256 before use.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0     # full history and tags: the test lock checks the tag test-lock is an ancestor of HEAD
          fetch-tags: true
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        id: py
        with:
          python-version: "3.13.2"

      # Cache the installed environment (not just the downloads), keyed on the exact lock file.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        id: venv
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ steps.py.outputs.python-version }}-${{ hashFiles('requirements.lock.txt') }}

      - name: Install pinned core environment
        if: steps.venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install -r requirements.lock.txt

      # The retrieval index and analogue table are gitignored (regenerable). Rebuild them
      # with the project's own scripts; verified to give the same index as the local one.
      - name: Rebuild retrieval index and analogues
        run: |
          .venv\Scripts\python.exe -m retrieval.build_index
          .venv\Scripts\python.exe -m retrieval.precompute_analogues

      # build_index also rewrites the committed (frozen v1) normalisation stats. Check the
      # rebuild agrees with the committed file to 1e-9, then restore the committed bytes so
      # the manifest check tests the repo, not this runner's float rounding.
      - name: Check rebuilt index stats, then restore the committed file
        shell: bash
        run: |
          set -euo pipefail
          f=retrieval/feature_normalization_stats.json
          git show "HEAD:$f" > "$RUNNER_TEMP/committed_stats.json"
          .venv/Scripts/python.exe - "$RUNNER_TEMP/committed_stats.json" "$f" <<'EOF'
          import json, math, sys
          def same(a, b):
              if isinstance(a, dict):
                  return isinstance(b, dict) and a.keys() == b.keys() and all(same(a[k], b[k]) for k in a)
              if isinstance(a, list):
                  return isinstance(b, list) and len(a) == len(b) and all(map(same, a, b))
              if isinstance(a, float) or isinstance(b, float):
                  return math.isclose(a, b, rel_tol=1e-9, abs_tol=1e-12)
              return a == b
          old, new = (json.load(open(p, encoding="utf-8")) for p in sys.argv[1:])
          sys.exit(0 if same(old, new) else "rebuilt index stats differ from the committed file beyond 1e-9")
          EOF
          git checkout -- "$f"

      # Fails if anything under training/ models/ pipeline/ retrieval/ evaluation/ configs/ differs from the tag.
      - name: Test lock (frozen code unchanged since test-lock)
        run: .venv\Scripts\python.exe -c "from training import test_lock; test_lock.require(); print('test lock OK')"

      - name: Tests
        run: .venv\Scripts\python.exe -m pytest -q -rs --durations=15

      - name: Frozen v1 manifest check
        run: .venv\Scripts\python.exe scripts/make_manifest.py --check

      - name: Test-run manifest check (test outputs and the data they used)
        run: .venv\Scripts\python.exe -m scripts.make_test_manifest --check

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # full history, so gitleaks scans every commit
          persist-credentials: false

      - name: Secret scan (gitleaks, full history)
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "${tarball}" gitleaks
          ./gitleaks git . --redact --no-banner

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"

      # --no-deps --disable-pip: audit exactly the pinned versions listed, without
      # downloading or installing them (the two lock files together are a full freeze, so
      # they are complete). The post-test packages are audited too, though CI never installs them.
      - name: Dependency audit (pip-audit)
        run: |
          set -euo pipefail
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements.txt -r requirements.lock.txt \
            -r requirements-post-test.txt -r requirements-post-test.lock.txt \
            --no-deps --disable-pip --strict --progress-spinner off
