# Dependabot opens pull requests when a pinned GitHub Action or Python package has a newer version or a security
# fix. Nothing is merged automatically: each PR runs CI and waits for review. Package updates matter mostly for
# security; the frozen test-lock code keeps working with the versions in the lock files.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
